spring.application.name=eduarda-mygarden-fullstack

# Banco usado nas aulas e no desenvolvimento local
spring.datasource.url=jdbc:h2:file:./data/mygarden;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT - N2
jwt.secret=mygarden-n2-chave-local-2026-super-secreta-com-mais-de-32-bytes
jwt.expiration-ms=28800000

# Upload de imagens (extra N2)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
